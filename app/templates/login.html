<!doctype html>
<html lang="fr">
<head>

<body class="login-page">
  <form method="post" class="card login">
    <div class="brand big"><span class="brand-main">SVETLANA</span><span class="brand-sub">AI DJ STUDIO</span></div>

    <button class="btn big" type="submit">Entrer dans le studio</button>
  </form>
</body>
</html>
